name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  verify:
    name: 1. Quality Gates (Lint & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

  deploy:
    name: 2. Deploy Docker to Production VPS
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Menghubungkan ke direktori proyek di VPS..."
            cd ${{ secrets.VPS_APP_DIR || '/var/www/trcodes.dev' }}

            echo "📥 Mengambil commit terbaru dari Git..."
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}

            echo "🐳 Membangun ulang Docker image aplikasi..."
            docker compose build app

            echo "🔄 Merestart container app di background..."
            docker compose up -d app

            echo "🗄️ Menjalankan migrasi database..."
            docker compose exec -T app npx prisma migrate deploy

            echo "🧹 Membersihkan build cache/image lama..."
            docker image prune -f

            echo "✅ Deployment Docker berhasil diselesaikan!"
